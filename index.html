<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kytice pro tebe</title>
<meta property="og:title" content="Kytice pro tebe">
<meta property="og:description" content="Malé překvapení &lt;3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%90</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Layout: a full-bleed terminal screen; the bouquet, hearts and sparkles are all drawn in coloured characters.
     Deliberately single-theme: it is a dark terminal in every viewer theme. */
  :root {
    --bg: #0b0e0c;        /* terminal black, faintly green */
    --glow: #141b16;      /* light pooled behind the bouquet */
    --muted: #5f7464;     /* prompt text */
    --hint: #a3b8a7;      /* the "how to use it" line, brighter so it gets noticed */
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--muted); overflow: hidden; }
  .stage {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 60% 55% at 50% 45%, var(--glow), var(--bg) 80%);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .prompt, .hint {
    position: fixed; pointer-events: none;
    font: 500 12px/1.4 var(--mono); color: var(--muted);
  }
  .prompt {
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
  }
  .prompt::after { content: "\2588"; margin-left: 2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hint {
    left: 0; right: 0; text-align: center; color: var(--hint);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    font-size: 13px;
    transition: opacity 1.2s ease;
  }
  .hint span { display: inline-block; white-space: nowrap; }   /* on a phone it breaks between the two halves */
  .hint.gone { opacity: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .prompt::after { animation: none; } }
</style>
</head>
<body>

<div class="stage"><canvas id="stage" aria-label="Kytice bílých kopretin, lisianthusů s fialovými okraji, fialových astr, zelených chryzantém, růžových alstroemérií, zlatobýlu a hledíků, svázaná levandulovou stuhou, se pomalu otáčí mezi poletujícími srdíčky"></canvas></div>
<div class="prompt">~ $ ./kytice</div>
<div class="hint gone" id="hint"><span>táhni a otoč kytici &middot;</span> <span>táhni dolů a uvidíš ji shora</span></div>
<div class="sr-only" id="letter-text" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  document.documentElement.lang = 'cs';
  if (!window.THREE) return;
  const V3 = THREE.Vector3;
  const UP = new V3(0, 1, 0);

  // Seeded random, so the bouquet is arranged the same way every time it opens.
  let seed = 1124;
  function rand() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const R = (a, b) => a + (b - a) * rand();
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const col = (h) => new THREE.Color(h);

  // ---------- renderer, scene, light ----------
  // The 3D scene renders off screen into a tiny image (one pixel block per character cell);
  // the visible canvas is 2D and draws one coloured character per cell.
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
  } catch (e) { return; }
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xfff6ea, 0x3c4a36, 0.85));
  const key = new THREE.DirectionalLight(0xfff0dc, 0.85);
  key.position.set(3, 5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe8ff, 0.35);
  rim.position.set(-4, 2, -3); scene.add(rim);

  const bouquet = new THREE.Group();
  scene.add(bouquet);

  // ---------- shared materials & geometry ----------
  const vcMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.62, metalness: 0 });
  const leafMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.45, metalness: 0 });
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x4f7a32, roughness: 0.7 });
  const sphereGeo = new THREE.SphereGeometry(1, 12, 9);
  const lowSphere = new THREE.SphereGeometry(1, 6, 4);
  const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 6, 1);

  function stemBetween(a, b, r, mat) {
    const d = new V3().subVectors(b, a);
    const m = new THREE.Mesh(cylGeo, mat || stemMat);
    m.scale.set(r, d.length(), r);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(UP, d.normalize());
    bouquet.add(m);
    return m;
  }
  function alignY(obj, dir) { obj.quaternion.setFromUnitVectors(UP, dir.clone().normalize()); }
  function faceUp(obj, dir) { // local Y along dir, local Z (the leaf's face) toward the sky
    const y = dir.clone().normalize();
    const z = UP.clone().addScaledVector(y, -y.y);
    if (z.lengthSq() < 1e-4) z.set(0, 0, 1);
    z.normalize();
    const x = new V3().crossVectors(y, z);
    obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  }

  // A bendable petal / leaf: a tapered plane, cupped across, curled along its length, coloured base -> tip.
  function bladeGeo(o) {
    const { len, wid, profile, cup = 0, fold = 0, curl = 0, ruffle = 0, ruffleFreq = 20,
            base, tip, tipStart = 0.25, segX = 6, segY = 8 } = o;
    const g = new THREE.PlaneGeometry(wid, len, segX, segY);
    g.translate(0, len / 2, 0);
    const p = g.attributes.position;
    const colors = new Float32Array(p.count * 3);
    const c = new THREE.Color();
    const phase = rand() * 6.28;
    const hw = wid / 2;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i);
      const t = Math.min(1, Math.max(0, y / len)), xn = x / hw, pr = profile(t);
      let z = -cup * xn * xn * hw * pr + fold * Math.abs(xn) * hw * pr + curl * t * t * len;
      if (ruffle) z += ruffle * Math.sin(xn * ruffleFreq + phase) * (0.3 + t);
      p.setXYZ(i, x * pr, y, z);
      c.copy(base).lerp(tip, smooth(tipStart, 1, t));
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    g.computeVertexNormals();
    return g;
  }

  // Petals arranged around the local +Y axis, each tilted `tilt` radians out from it.
  function addPetal(parent, geo, mat, tilt, spin) {
    const pivot = new THREE.Group();
    pivot.rotation.y = spin;
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = tilt;
    pivot.add(m);
    parent.add(pivot);
    return m;
  }

  // ---------- flowers ----------
  const mumFloretGeo = new THREE.SphereGeometry(1, 5, 4);
  function makeMum(pos, dir, r) {
    const g = new THREE.Group();
    g.position.copy(pos); alignY(g, dir);
    const core = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ color: 0x557f24, roughness: 0.8 }));
    core.scale.setScalar(r * 0.9);
    g.add(core);
    const n = 150;
    const florets = new THREE.InstancedMesh(mumFloretGeo, new THREE.MeshStandardMaterial({ roughness: 0.75 }), n);
    const dummy = new THREE.Object3D();
    const light = col('#b9d860'), mid = col('#8fbb3a'), deep = col('#6e9c2c'), c = new THREE.Color();
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const yy = 1 - (i + 0.5) / n * 1.7;          // skip the very bottom, it sits on stems
      const rr = Math.sqrt(Math.max(0, 1 - yy * yy));
      const d = new V3(Math.cos(i * golden) * rr, yy, Math.sin(i * golden) * rr).normalize();
      dummy.position.copy(d).multiplyScalar(r * 0.93);
      dummy.quaternion.setFromUnitVectors(new V3(0, 0, 1), d);
      const s = r * R(0.17, 0.22);
      dummy.scale.set(s, s, s * 1.5);
      dummy.updateMatrix();
      florets.setMatrixAt(i, dummy.matrix);
      c.copy(yy > 0.75 ? light : mid).lerp(deep, rand() * 0.45);
      if (yy > 0.9) c.lerp(col('#d4dc6a'), 0.4);    // the paler, tighter centre
      florets.setColorAt(i, c);
    }
    g.add(florets);
    bouquet.add(g);
  }

  const alstPalettes = [
    { outerBase: '#f9d6e2', outerTip: '#e8789c', innerTip: '#f2a6bd' },
    { outerBase: '#fadbe5', outerTip: '#f08fae', innerTip: '#f7bfd0' },
    { outerBase: '#fdf7f6', outerTip: '#f2a6bf', innerTip: '#fbe0e8' },
    { outerBase: '#fffafa', outerTip: '#eea0ba', innerTip: '#fdeef2' },
  ];
  const stamenMat = new THREE.MeshStandardMaterial({ color: 0xe9b7c4, roughness: 0.6 });
  const antherMat = new THREE.MeshStandardMaterial({ color: 0x6a2e40, roughness: 0.6 });
  function makeAlstroemeria(pos, dir) {
    const g = new THREE.Group();
    g.position.copy(pos); alignY(g, dir); g.rotateY(rand() * 6.28); g.scale.setScalar(1.45);
    const pal = pick(alstPalettes);
    const tilt0 = R(0.75, 0.95);
    for (let i = 0; i < 3; i++) {
      addPetal(g, bladeGeo({
        len: R(0.2, 0.23), wid: 0.12, cup: 0.35, curl: 0.12,
        profile: (t) => Math.pow(Math.sin(Math.PI * Math.pow(t, 0.8)), 0.65),
        base: col(pal.outerBase), tip: col(pal.outerTip), tipStart: 0.45,
      }), vcMat, tilt0 + R(-0.08, 0.08), i * 2.094);
    }
    for (let i = 0; i < 3; i++) {
      addPetal(g, bladeGeo({
        len: R(0.17, 0.19), wid: 0.075, cup: 0.4, curl: 0.18,
        profile: (t) => Math.pow(Math.sin(Math.PI * Math.pow(t, 0.75)), 0.7),
        base: col('#f6dd9a'), tip: col(pal.innerTip), tipStart: 0.2,
      }), vcMat, tilt0 - 0.25, i * 2.094 + 1.047);
    }
    for (let i = 0; i < 6; i++) {
      const a = i * 1.047 + R(-0.2, 0.2), lean = R(0.15, 0.35), L = R(0.1, 0.14);
      const tipP = new V3(Math.sin(lean) * Math.cos(a) * L, Math.cos(lean) * L, Math.sin(lean) * Math.sin(a) * L);
      const s = new THREE.Mesh(cylGeo, stamenMat);
      s.scale.set(0.004, L, 0.004);
      s.position.copy(tipP).multiplyScalar(0.5);
      s.quaternion.setFromUnitVectors(UP, tipP.clone().normalize());
      g.add(s);
      const an = new THREE.Mesh(lowSphere, antherMat);
      an.scale.set(0.008, 0.014, 0.008);
      an.position.copy(tipP);
      g.add(an);
    }
    bouquet.add(g);
  }

  function makeCarnation(pos, dir, o = {}) {
    const { base = '#ea9a8a', tip = '#fcd3c6', scale = 1.6, open = 1 } = o;
    const g = new THREE.Group();
    g.position.copy(pos); alignY(g, dir); g.scale.setScalar(scale); g.rotateY(rand() * 6.28);
    const n = 46, golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1);
      addPetal(g, bladeGeo({
        len: 0.1 + 0.05 * f, wid: 0.13, cup: 0.25, curl: 0.05 + 0.15 * f,
        ruffle: 0.012, ruffleFreq: 16,
        profile: (t) => Math.pow(t, 0.5) * (1 - 0.15 * t),
        base: col(base), tip: col(tip), tipStart: 0.35,
      }), vcMat, 0.15 + 1.25 * open * Math.pow(f, 0.8), i * golden);
    }
    const calyx = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.03, 0.12, 10), new THREE.MeshStandardMaterial({ color: 0x5c8a3c, roughness: 0.6 }));
    calyx.position.y = -0.05;
    g.add(calyx);
    bouquet.add(g);
  }

  const creamMat = new THREE.MeshStandardMaterial({ color: 0xf3f1dc, roughness: 0.55 });
  const throatMat = new THREE.MeshStandardMaterial({ color: 0xdfe6b4, roughness: 0.55 });
  const budMats = ['#cfe2a0', '#b7d47f', '#9fc464'].map((h) => new THREE.MeshStandardMaterial({ color: col(h), roughness: 0.6 }));
  function makeSnapdragon(pos, dir, len, openFrac, n, bloom) {
    const g = new THREE.Group();
    g.position.copy(pos); alignY(g, dir); g.rotateY(rand() * 6.28);
    const stem = new THREE.Mesh(cylGeo, stemMat);
    stem.scale.set(0.012, len, 0.012); stem.position.y = len / 2;
    g.add(stem);
    for (let k = 0; k < n; k++) {
      const s = k / (n - 1), size = 1 - 0.6 * s, a = k * 2.4;
      const y = 0.03 + s * len;
      if (s < openFrac) {
        const r = 0.045 * size * bloom;
        const b = new THREE.Group();
        b.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
        b.rotation.y = -a;
        const upper = new THREE.Mesh(sphereGeo, creamMat);
        upper.scale.set(0.05, 0.034, 0.045).multiplyScalar(size * bloom);
        upper.position.set(0.025 * size, 0.018 * size, 0);
        const lower = new THREE.Mesh(sphereGeo, s < openFrac * 0.5 ? creamMat : throatMat);
        lower.scale.set(0.045, 0.028, 0.04).multiplyScalar(size * bloom);
        lower.position.set(0.03 * size, -0.012 * size, 0);
        b.add(upper, lower);
        g.add(b);
      } else {
        const bud = new THREE.Mesh(sphereGeo, budMats[Math.min(2, Math.floor((s - openFrac) / (1 - openFrac) * 3))]);
        bud.scale.set(0.022, 0.036, 0.022).multiplyScalar(size + 0.3);
        bud.position.set(Math.cos(a) * 0.02 * size, y, Math.sin(a) * 0.02 * size);
        g.add(bud);
      }
    }
    bouquet.add(g);
  }

  // Goldenrod: every tiny yellow floret in the bouquet is one instance of a single mesh.
  const goldDots = [];
  function makeSolidago(pos, dir, size) {
    const d0 = dir.clone().normalize();
    const branches = 6 + Math.floor(rand() * 4);
    for (let b = 0; b < branches; b++) {
      const jitter = new V3(R(-1, 1), R(-1, 1), R(-1, 1)).multiplyScalar(0.75);
      const bd = d0.clone().add(jitter).normalize();
      if (bd.dot(d0) < 0.2) bd.add(d0).normalize();
      const L = size * R(0.55, 1);
      const start = pos.clone().addScaledVector(d0, R(-0.02, 0.06));
      const end = start.clone().addScaledVector(bd, L);
      stemBetween(start, end, 0.005, stemMat);
      const m = 12 + Math.floor(rand() * 8);
      for (let k = 0; k < m; k++) {
        const t = 0.25 + 0.75 * Math.pow(rand(), 0.7);
        const p = start.clone().lerp(end, t).add(new V3(R(-1, 1), R(-1, 1), R(-1, 1)).multiplyScalar(0.028 + 0.02 * t));
        goldDots.push({ p, s: R(0.014, 0.024) });
      }
    }
  }

  function makeLeaf(pos, dir, len, wid, dark) {
    const m = new THREE.Mesh(bladeGeo({
      len, wid, fold: 0.18, curl: -R(0.12, 0.25), segX: 6, segY: 10,
      profile: (t) => Math.pow(Math.sin(Math.PI * Math.pow(t, 0.72)), 0.8),
      base: col(dark ? '#2c5228' : '#4c7d34'), tip: col(dark ? '#3f6e36' : '#6e9a44'), tipStart: 0,
    }), leafMat);
    m.position.copy(pos); faceUp(m, dir);
    m.rotateY(R(-0.25, 0.25));
    bouquet.add(m);
  }

  // ---------- stems & ribbon ----------
  // Every stem runs from its flower to a point inside the tie, then on down; together they make the bundle.
  function toBind(from, r) {
    const a = R(0, 6.28), rr = 0.085 * Math.sqrt(rand());
    const tie = BIND.clone().add(new V3(Math.cos(a) * rr, R(-0.02, 0.02), Math.sin(a) * rr));
    stemBetween(from, tie, r);
    const end = tie.clone().add(new V3(Math.cos(a) * rr * 1.6, R(-1.0, -0.88), Math.sin(a) * rr * 1.6));
    stemBetween(tie, end, r * 1.15);
  }

  const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xb39ae6, roughness: 0.35, metalness: 0.05, side: THREE.DoubleSide });
  function makeRibbon() {
    const y = BIND.y;
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.105, 0.1, 28, 1, true), ribbonMat);
    band.position.y = y;
    bouquet.add(band);
    const bow = new THREE.Group();
    bow.position.set(0, y, 0.12);
    const loopGeo = new THREE.TorusGeometry(0.1, 0.028, 8, 28);
    [-1, 1].forEach((side) => {
      const loop = new THREE.Mesh(loopGeo, ribbonMat);
      loop.scale.set(1, 0.6, 1);
      loop.position.set(side * 0.1, 0.015, 0.01);
      loop.rotation.set(0, side * 0.35, side * 0.25);
      bow.add(loop);
      const tail = new THREE.Mesh(bladeGeo({
        len: 0.42, wid: 0.07, curl: 0.08, segY: 10,
        profile: (t) => (t > 0.92 ? 1 - (t - 0.92) * 6 : 1),
        base: col('#b39ae6'), tip: col('#cbb8f0'),
      }), vcMat);
      tail.rotation.set(0, side * 0.2, Math.PI + side * 0.32);
      tail.position.set(side * 0.01, -0.01, 0.01);
      bow.add(tail);
    });
    const knot = new THREE.Mesh(sphereGeo, ribbonMat);
    knot.scale.set(0.045, 0.04, 0.035);
    knot.position.z = 0.015;
    bow.add(knot);
    bouquet.add(bow);
  }

  // ---------- flowers from the second bouquet ----------
  // Daisy-shaped heads: white and pink spray chrysanthemums, and the small violet asters.
  function makeDaisy(pos, dir, o) {
    const { size = 1, petals = 22, base, tip, center = '#b9c43c', centerR = 0.055, len = 0.17, wid = 0.042, tilt = 1.3 } = o;
    const g = new THREE.Group();
    g.position.copy(pos); alignY(g, dir); g.rotateY(rand() * 6.28); g.scale.setScalar(size);
    const disc = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ color: col(center), roughness: 0.85 }));
    disc.scale.set(centerR, centerR * 0.55, centerR); disc.position.y = 0.015;
    g.add(disc);
    for (let i = 0; i < petals; i++) {
      addPetal(g, bladeGeo({
        len: len * R(0.85, 1.05), wid, cup: 0.2, curl: -0.04, segX: 2, segY: 4,
        profile: (t) => Math.min(1, 0.35 + t * 3) * Math.sqrt(Math.max(0, 1 - Math.pow(t, 8))),
        base: col(base), tip: col(tip), tipStart: 0.1,
      }), vcMat, tilt + (i % 2 ? 0.12 : -0.05) + R(-0.06, 0.06), (i / petals) * 6.283 + R(-0.05, 0.05));
    }
    bouquet.add(g);
  }
  const whiteDaisy = () => ({ size: R(1.15, 1.3), petals: 24, base: '#e6edd6', tip: '#ffffff', center: '#b3c238', centerR: 0.07 });
  const pinkDaisy = () => ({ size: R(0.75, 0.85), petals: 20, base: '#c475b2', tip: '#eba8da', center: '#a9b83a' });
  const aster = () => ({ size: R(0.5, 0.6), petals: 14, base: '#6a5ad6', tip: '#8f80ee', center: '#f0c419', len: 0.15, wid: 0.035, tilt: 1.25 });

  // Lisianthus: a loose rose-like cup of white petals with violet edges.
  function makeLisianthus(pos, dir, size = 1) {
    const g = new THREE.Group();
    g.position.copy(pos); alignY(g, dir); g.rotateY(rand() * 6.28); g.scale.setScalar(size);
    [{ n: 5, tilt: 0.35, len: 0.13 }, { n: 6, tilt: 0.7, len: 0.16 }, { n: 6, tilt: 1.0, len: 0.18 }].forEach((L, li) => {
      for (let i = 0; i < L.n; i++) {
        addPetal(g, bladeGeo({
          len: L.len, wid: 0.15, cup: 0.45, curl: 0.06, ruffle: 0.008, ruffleFreq: 10,
          profile: (t) => Math.pow(Math.sin(Math.PI * (0.12 + 0.78 * t)), 0.6),
          base: col('#fbfaf6'), tip: col('#6b3fd6'), tipStart: 0.62,
        }), vcMat, L.tilt + R(-0.08, 0.08), (i / L.n) * 6.283 + li * 0.5);
      }
    });
    bouquet.add(g);
  }

  const budCream = new THREE.MeshStandardMaterial({ color: 0xe2ebbd, roughness: 0.55 });
  function makeLisianthusBuds(pos, dir, n) {
    const d0 = dir.clone().normalize();
    for (let i = 0; i < n; i++) {
      const bd = d0.clone().add(new V3(R(-0.5, 0.5), R(-0.2, 0.4), R(-0.5, 0.5))).normalize();
      const tipP = pos.clone().addScaledVector(bd, R(0.12, 0.25));
      stemBetween(pos, tipP, 0.012);
      const b = new THREE.Mesh(sphereGeo, budCream);
      b.scale.set(0.04, 0.085, 0.04);
      b.position.copy(tipP).addScaledVector(bd, 0.06);
      alignY(b, bd);
      bouquet.add(b);
    }

    const age = t - meme.at;
    const printed = reduce ? h : Math.floor(h * smooth(0, 1, age / 0.9));   // it prints in, line by line
    for (let r = -1; r <= h; r++) {             // the same gold frame as the letter
      for (let c = -2; c <= w + 1; c++) {
        const edgeR = r === -1 || r === h, edgeC = c === -2 || c === w + 1;
        let ch = ' ';
        if (edgeR && edgeC) ch = r === -1 ? '.' : "'";
        else if (edgeR) ch = '-';
        else if (edgeC) ch = '|';
        put(c0 + c, r0 + r, ch, LETTER_COLORS.frame, 1, true);
      }
    }
    const b0 = Math.round(MEME_BAND[0] * h), b1 = Math.round(MEME_BAND[1] * h);
    for (let r = 0; r < printed; r++) {
      if (r >= b0 && r < b1) continue;          // the caption bar stays dark
      for (let c = 0; c < w; c++) { const cell = cells[r * w + c]; put(c0 + c, r0 + r, cell.ch, cell.color, 1, true); }
    }
    meme.text = printed >= b1 ? {
      x: offX + (c0 + w / 2) * cellW, y: offY + (r0 + (b0 + b1) / 2) * cellH, maxW: w * cellW - 16,
      closeY: offY + (r0 + h + 2) * cellH, fade: smooth(0.5, 0.9, age), closeFade: smooth(1.2, 1.6, age),
    } : null;
    return age > 1.2;
  }

  // ---------- drawing ----------
  let d;   // colorImg.data for the current frame
  function put(c, r, ch, color, k, overwrite) {
    c = Math.round(c); r = Math.round(r);
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    const idx = r * cols + c;
    if (!overwrite && cellG[idx] >= 0) return;   // the bouquet (or something nearer) is in front
    cellG[idx] = ch.charCodeAt(0) - 32;
    const o = idx * 4;
    d[o] = color[0] * k; d[o + 1] = color[1] * k; d[o + 2] = color[2] * k;
  }
  function stamp(lines, c0, r0, color, k, solid) {
    lines.forEach((line, j) => {
      const first = line.search(/\S/);
      for (let i = 0; i < line.length; i++) {
        if (solid && i >= first) put(c0 + i, r0 + j, line[i], color, k, true);   // opaque, in front of the flowers
        else if (line[i] !== ' ') put(c0 + i, r0 + j, line[i], color, k, false);
      }
    });
  }

  // The letter uses the same monospace characters as the bouquet, just bigger (2-3 cells per character)
  // so it reads comfortably. Its characters are collected here and painted after the grid.
  const bigGlyphs = [];   // {ch, color, x, y, scale}: drawn on top of the grid each frame
  function drawLetter(t) {
    const inner = Math.max(CLOSE_LINE.length, ...LETTER.map((l) => l[0].length)) + 4;
    const bw = inner + 2, bh = LETTER.length + 6;
    const sc = Math.max(1, Math.min(3, (cols - 4) / bw, (rows - 4) / bh));
    const c0 = Math.round((cols - bw * sc) / 2), r0 = Math.round((rows - bh * sc) / 2);
    for (let r = 0; r < Math.ceil(bh * sc); r++) for (let c = 0; c < Math.ceil(bw * sc); c++) put(c0 + c, r0 + r, ' ', LETTER_COLORS.frame, 1, true);
    const at = (c, r, ch, color) => bigGlyphs.push({ ch, color, scale: sc, x: offX + (c0 + (c + 0.5) * sc) * cellW, y: offY + (r0 + (r + 0.5) * sc) * cellH });
    for (let r = 0; r < bh; r++) {
      for (let c = 0; c < bw; c++) {
        const edgeR = r === 0 || r === bh - 1, edgeC = c === 0 || c === bw - 1;
        if (edgeR && edgeC) at(c, r, r === 0 ? '.' : "'", LETTER_COLORS.frame);
        else if (edgeR) at(c, r, '-', LETTER_COLORS.frame);
        else if (edgeC) at(c, r, '|', LETTER_COLORS.frame);
      }
    }
    // type the letter out, about 40 characters a second
    let budget = reduce ? 1e9 : (t - letter.at) * 40;
    LETTER.forEach(([text, tone], j) => {
      const shown = text.slice(0, Math.max(0, Math.floor(budget)));
      budget -= text.length + 2;
      for (let i = 0; i < shown.length; i++) if (shown[i] !== ' ') at(3 + i, 2 + j, shown[i], LETTER_COLORS[tone] || LETTER_COLORS.text);
    });
    if (budget > 10) {
      const cc = Math.round((bw - CLOSE_LINE.length) / 2);
      for (let i = 0; i < CLOSE_LINE.length; i++) if (CLOSE_LINE[i] !== ' ') at(cc + i, bh - 2, CLOSE_LINE[i], LETTER_COLORS.muted);
    }
    return budget > 0;
  }

  function draw(t) {
    if (!cols || !rows) return;
    renderer.setRenderTarget(rt);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.readRenderTargetPixels(rt, 0, 0, cols * SS, rows * SS, pixels);
    renderer.setRenderTarget(null);

    d = colorImg.data;
    const W = cols * SS, last = RAMP.length - 1, dim = letter.open || meme.open ? 0.3 : 1;
    // 1. the bouquet
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let sr = 0, sg = 0, sb = 0, n = 0;
        for (let yy = 0; yy < SS; yy++) {
          const row = ((rows - 1 - r) * SS + yy) * W;   // GL rows run bottom-up
          for (let xx = 0; xx < SS; xx++) {
            const i = (row + c * SS + xx) * 4;
            if (pixels[i + 3]) { sr += pixels[i]; sg += pixels[i + 1]; sb += pixels[i + 2]; n++; }
          }
        }
        const idx = r * cols + c, o = idx * 4;
        if (n < 2) { cellG[idx] = -1; bouquetMask[idx] = 0; continue; }
        sr /= n; sg /= n; sb /= n;
        const L = (0.299 * sr + 0.587 * sg + 0.114 * sb) / 255;
        const k = Math.max(1, Math.min(last, Math.round(Math.pow(L, 0.75) * 1.3 * last)));
        cellG[idx] = RAMP_G[k]; bouquetMask[idx] = 1;
        // keep the hue vivid; brightness is carried mostly by the glyph
        const mx = Math.max(sr, sg, sb, 1), sc = (150 + 105 * Math.min(1, L * 1.4)) / mx * dim;
        d[o] = Math.min(255, sr * sc); d[o + 1] = Math.min(255, sg * sc); d[o + 2] = Math.min(255, sb * sc);
      }
    }
    // 2. the envelope: slightly bigger characters, always BEHIND the bouquet, wrapped in twinkling sparkles
    bigGlyphs.length = 0;
    env.visible = 0;
    if (env.shown > 0 && !letter.open && !meme.open) {
      const ec = env.c, er = env.r;
      // is any cell under this footprint taken by the bouquet? (bouquet glyphs are > 0; blanks are 0)
      const behind = (c0, r0) => {
        for (let r = Math.floor(r0); r < Math.ceil(r0 + ES); r++) {
          for (let c = Math.floor(c0); c < Math.ceil(c0 + ES); c++) {
            if (c >= 0 && r >= 0 && c < cols && r < rows && cellG[r * cols + c] > 0) return true;
          }
        }
        return false;
      };
      // keep hearts out of the envelope's area wherever the bouquet isn't covering it
      for (let r = Math.floor(er); r < Math.ceil(er + ENV_H); r++) {
        for (let c = Math.floor(ec); c < Math.ceil(ec + ENV_W); c++) put(c, r, ' ', ENV_GOLD, 1, false);
      }
      const pulse = (0.85 + 0.15 * Math.sin(t * 3)) * env.shown;
      const tint = ENV_GOLD.map((v) => v * pulse);
      let total = 0, seen = 0;
      ENVELOPE.forEach((line, j) => {
        for (let i = 0; i < line.length; i++) {
          if (line[i] === ' ') continue;
          total++;
          if (behind(ec + i * ES, er + j * ES)) continue;
          seen++;
          bigGlyphs.push({ ch: line[i], color: tint, scale: ES, x: offX + (ec + (i + 0.5) * ES) * cellW, y: offY + (er + (j + 0.5) * ES) * cellH });
        }
      });
      env.visible = total ? seen / total : 0;
      // a ring of sparkles circling it; they peek around the flowers even while it hides behind them
      const cx = ec + ENV_W / 2, cy = er + ENV_H / 2;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * 6.283 + t * 0.5;
        const b = 0.5 + 0.5 * Math.sin(t * 2.5 + i * 2.1);
        if (b < 0.35) continue;
        put(cx + Math.cos(a) * (ENV_W / 2 + 2.5), cy + Math.sin(a) * (ENV_H / 2 + 1.8),
            b > 0.85 ? '*' : b > 0.6 ? '+' : '.', SPARK_COLORS[i % SPARK_COLORS.length], (0.25 + 0.4 * b) * env.shown, false);
      }
      // star flashes: + then -*- with | above and below, then fading back to +
      for (const f of flashes) {
        const k = f.age / f.life, glow = Math.sin(Math.PI * k) * env.shown;
        const tone = f.tone;
        if (k < 0.35 || k > 0.65) { put(f.c, f.r, k < 0.2 || k > 0.8 ? '.' : '+', tone, 0.2 + 0.4 * glow, false); continue; }
        put(f.c, f.r, '*', tone, 0.75 * glow, false);
        put(f.c - 1, f.r, '-', tone, 0.4 * glow, false); put(f.c + 1, f.r, '-', tone, 0.4 * glow, false);
      }
      // and the gold dust trailing behind it
      for (const p of dust) {
        const f = 1 - p.age / p.life;
        put(p.c, p.r, f > 0.75 ? '+' : '.', p.tone, (0.2 + 0.4 * f) * env.shown, false);
      }
    }
    // 2b. the playful lines from a "missed" tap (painted at the end, in the hint's font)
    for (let i = quips.length - 1; i >= 0; i--) if (t - quips[i].at > 2.4) quips.splice(i, 1);
    // 3. hearts and sparkles, twinkling in and out
    const intro = smooth(0.4, 3, t);
    for (const p of particles) {
      const fade = Math.pow(Math.sin(Math.PI * p.age / p.life), 0.8) * intro * dim;
      const tw = p.art.length === 1 && p.art[0].length === 1 ? 0.7 + 0.3 * Math.sin(t * 5 + p.phase) : 1;
      if (fade > 0.05) stamp(p.art, p.x, p.y, p.color, fade * tw);
    }
    // 4. the letter, on top of everything
    if (letter.open) letter.typing = !drawLetter(t);   // still typing until every line is out
    if (meme.open) meme.ready = drawMeme(t);
    // 5. paint: white glyphs first, then tint them all in one pass
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < rows; r++) {
      const y = Math.round((offY + r * cellH) * dpr);
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c, g = cellG[idx];
        d[idx * 4 + 3] = g > 0 ? 255 : 0;
        if (g > 0) ctx.drawImage(atlas, g * gw, 0, gw, gh, Math.round((offX + c * cellW) * dpr), y, gw, gh);
      }
    }
    colorCtx.putImageData(colorImg, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(colorCanvas, offX * dpr, offY * dpr, cols * cellW * dpr, rows * cellH * dpr);
    ctx.globalCompositeOperation = 'source-over';
    // 6. the big characters: the envelope and the letter
    let scale = 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const g of bigGlyphs) {
      if (g.scale !== scale) { scale = g.scale; ctx.font = `700 ${fontPx * scale * dpr}px ${MONO}`; }
      ctx.fillStyle = `rgb(${g.color[0] | 0},${g.color[1] | 0},${g.color[2] | 0})`;
      ctx.fillText(g.ch, g.x * dpr, g.y * dpr);
    }
    // 7a. the meme's caption (white, in its dark bar) and how to close it, in the hint's font
    if (meme.open && meme.text) {
      const m = meme.text;
      ctx.font = `500 ${QUIP_PX * dpr}px ${MONO}`;
      const full = ctx.measureText(MEME_CAPTION).width / dpr;
      if (full > m.maxW) ctx.font = `500 ${QUIP_PX * m.maxW / full * dpr}px ${MONO}`;
      ctx.fillStyle = `rgba(255,255,255,${m.fade})`;
      ctx.fillText(MEME_CAPTION, m.x * dpr, m.y * dpr);
      ctx.font = `500 ${QUIP_PX * dpr}px ${MONO}`;
      ctx.fillStyle = `rgba(${LETTER_COLORS.muted.map((v) => v | 0).join(',')},${m.closeFade})`;
      ctx.fillText(MEME_CLOSE, m.x * dpr, m.closeY * dpr);
    }
    // 7. the playful lines: same font as the hint at the bottom, rising from the tap and fading away
    if (quips.length) {
      const W = canvas.width / dpr;
      for (const q of quips) {
        const age = t - q.at, fade = Math.min(1, age / 0.12) * (1 - smooth(1.5, 2.4, age));
        // the hint's font; a line too long for a narrow phone shrinks just enough to fit
        ctx.font = `500 ${QUIP_PX * dpr}px ${MONO}`;
        const full = ctx.measureText(q.text).width / dpr;
        if (full > W - 32) ctx.font = `500 ${QUIP_PX * (W - 32) / full * dpr}px ${MONO}`;
        const half = Math.min(full, W - 32) / 2;
        const x = Math.max(16 + half, Math.min(W - 16 - half, offX + q.c * cellW));
        const y = offY + (q.r - 3 - age * 2.5) * cellH;
        ctx.fillStyle = `rgba(${QUIP_COLOR[0] | 0},${QUIP_COLOR[1] | 0},${QUIP_COLOR[2] | 0},${fade})`;
        ctx.fillText(q.text, x * dpr, Math.max(12, y) * dpr);
      }
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // ---------- spin, drag & tap ----------
  const baseSpeed = reduce ? 0.12 : 0.32; // radians per second
  let angle = 0, vel = baseSpeed, dragging = false, lastX = 0, lastY = 0, lastT = 0;
  let downX = 0, downY = 0, downT = 0;
  const hint = document.getElementById('hint');
  function cellAt(e) {
    const rect = canvas.getBoundingClientRect();
    return { c: (e.clientX - rect.left - offX) / cellW, r: (e.clientY - rect.top - offY) / cellH };
  }
  // ---------- playful misses: the first three taps make the envelope dart away ----------
  const DODGE_LINES = ['loool, těsně brou', 'aim jak ve fonku', 'nedivim se ze mam ja vsechny killy vzdycky :P'];
  const QUIP_COLOR = rgb('#ff9cc2');
  const QUIP_PX = 13;   // same size and weight as the hint line
  const DODGE_TIME = 0.55;   // seconds for the swoosh
  const dodge = { count: 0, at: -10, from: 0, to: 0 };
  const quips = [];          // {text, c, r, at}
  function dodgeOffset(t) {  // extra phase along the envelope's path, eased
    const k = Math.min(1, (t - dodge.at) / (reduce ? 0.01 : DODGE_TIME));
    return dodge.from + (dodge.to - dodge.from) * (1 - Math.pow(1 - k, 3));
  }
  function envPos(a) {       // where the envelope sits for a given path phase
    const rx = Math.min(cols * 0.42, 60), ry = rows * 0.28;
    return {
      c: Math.max(3, Math.min(cols - ENV_W - 4, cols / 2 + rx * Math.sin(a) - ENV_W / 2)),
      r: Math.max(3, Math.min(rows - ENV_H - 6, rows * 0.42 + ry * Math.sin(a * 1.6 + 0.6) - ENV_H / 2)),
    };
  }
  function coveredShare(p) { // how much of the envelope would sit behind the flowers at p
    let hit = 0, n = 0;
    for (let r = Math.floor(p.r); r < Math.ceil(p.r + ENV_H); r++) {
      for (let c = Math.floor(p.c); c < Math.ceil(p.c + ENV_W); c++, n++) if (bouquetMask[r * cols + c]) hit++;
    }
    return n ? hit / n : 1;
  }
  function startDodge(t, tapC, tapR) {
    // jump ahead along the path to a spot well away from here and clear of the flowers
    let best = 3, bestScore = Infinity;
    for (let d = 1.4; d <= 4.8; d += 0.1) {
      const p = envPos(env.a + d);
      const far = Math.hypot(p.c - env.c, (p.r - env.r) * 2);
      const score = coveredShare(p) * 10 + (far < cols * 0.25 ? 5 : 0) - far * 0.01;
      if (score < bestScore) { bestScore = score; best = d; }
    }
    const now = dodgeOffset(t);
    dodge.from = now; dodge.to = now + best; dodge.at = t;
    // a little puff of sparkle where it was
    for (let i = 0; i < 10; i++) {
      dust.push({ c: env.c + R(0, ENV_W), r: env.r + R(0, ENV_H), vc: R(-4, 4), vr: R(-3, 3), age: 0, life: R(0.5, 1), tone: pick(SPARK_COLORS) });
    }
    quips.push({ text: DODGE_LINES[dodge.count], c: tapC, r: tapR, at: t });
    letterText.textContent = DODGE_LINES[dodge.count];
    dodge.count++;
  }
  function overEnvelope(e) {
    if (env.shown < 0.5 || env.visible < 0.3 || letter.open || meme.open) return false;
    if (clock.elapsedTime - dodge.at < DODGE_TIME) return false;   // mid-swoosh
    const p = cellAt(e);
    return p.c > env.c - 2 && p.c < env.c + ENV_W + 2 && p.r > env.r - 1.5 && p.r < env.r + ENV_H + 1.5;
  }
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = downX = e.clientX; lastY = downY = e.clientY; lastT = downT = performance.now();
    canvas.setPointerCapture(e.pointerId);
    hint.classList.add('gone');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) { canvas.style.cursor = overEnvelope(e) ? 'pointer' : ''; return; }
    const now = performance.now(), dx = e.clientX - lastX;
    const dd = dx * 0.008;
    angle += dd;
    vel = dd / Math.max(0.016, (now - lastT) / 1000);
    // drag down to tip the bouquet toward you and look at it from above
    pitch = Math.min(PITCH_MAX, Math.max(PITCH_MIN, pitch + (e.clientY - lastY) * 0.006));
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  canvas.addEventListener('pointerup', (e) => {
    dragging = false;
    const tap = Math.hypot(e.clientX - downX, e.clientY - downY) < 10 && performance.now() - downT < 600;
    if (!tap) return;
    if (meme.open) {
      if (meme.ready) { meme.open = false; letterText.textContent = ''; }
      return;
    }
    if (letter.open) {
      if (!letter.typing) {
        letter.open = false; letterText.textContent = '';
        if (!meme.shown && meme.img) meme.pendingAt = clock.elapsedTime + 0.5;   // ...and then the joke
      }
    } else if (overEnvelope(e)) {
      if (dodge.count < DODGE_LINES.length) {   // not yet!
        const p = cellAt(e);
        startDodge(clock.elapsedTime, p.c, p.r);
        return;
      }
      letter.open = true; letter.at = clock.elapsedTime; letter.typing = true;
      letterText.textContent = LETTER.map((l) => l[0]).filter(Boolean).join(' ');
      canvas.style.cursor = '';
    }
  });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  // show the hint once the bouquet has grown; it stays until she first touches it (or ~15 s)
  let touched = false;
  canvas.addEventListener('pointerdown', () => { touched = true; }, { once: true });
  setTimeout(() => { if (!touched) hint.classList.remove('gone'); }, (GROW_START + GROW_TIME) * 1000);
  setTimeout(() => hint.classList.add('gone'), 19000);

  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (!dragging) {
      vel += (baseSpeed - vel) * Math.min(1, dt * 1.2);
      angle += vel * dt;
    }
    bouquet.rotation.y = angle;
    placeCamera();
    bouquet.rotation.z = reduce ? 0 : 0.02 * Math.sin(t * 0.7);
    bouquet.rotation.x = reduce ? 0 : 0.012 * Math.sin(t * 0.5 + 1);
    if (!reduce) clip.constant = -1.6 + 4.6 * smooth(0, 1, (t - GROW_START) / GROW_TIME);
    // the envelope fades in once the bouquet has grown, then circles it slowly
    const envStart = GROW_START + GROW_TIME + 2.5;
    env.shown = smooth(envStart, envStart + 2, t);
    // it sweeps from side to side and crosses behind the middle of the bouquet, slow enough to tap on a phone
    env.a = (reduce ? 0.03 : 0.07) * (t - envStart) + 2.2 + dodgeOffset(t);
    const pos = envPos(env.a);
    env.c = pos.c; env.r = pos.r;
    if (meme.pendingAt && t >= meme.pendingAt) {
      meme.pendingAt = 0; meme.open = meme.shown = true; meme.at = t; meme.ready = false;
      letterText.textContent = MEME_CAPTION;
    }
    updateParticles(dt, t);
    updateDust(dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
